services:
  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env.production
    expose:
      - "8080"
    volumes:
      - safe_route_data:/app/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  safe_route_data:
  caddy_data:
  caddy_config:

networks:
  internal:
